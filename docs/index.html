<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="color-scheme" content="dark light"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>markdown-kit — Markdown with a streaming reveal</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--ink:#e7e9ee;--mut:#9aa3b2;--line:#252a34;--acc:#22c55e;--code:#1d222b}
:root[data-theme="light"]{color-scheme:light;--bg:#f6f7f9;--card:#fff;--ink:#0f1115;--mut:#4b5563;--line:#dfe3e8;--acc:#15803d;--code:#f1f3f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header,main,footer{max-width:1000px;margin:0 auto;padding:24px 20px}
h1{margin:0 0 6px;font-size:24px}
.mut{color:var(--mut)}
.theme-btn{float:right;width:30px;height:30px;margin:2px 0 0 10px;padding:0;background:transparent;color:inherit;
  border:1px solid var(--line);border-radius:50%;cursor:pointer;opacity:.8}
.theme-btn:hover{opacity:1}.theme-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.split{display:grid;gap:14px;grid-template-columns:1fr 1fr;margin:16px 0}
@media(max-width:820px){.split{grid-template-columns:1fr}}
.pane{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-height:340px;overflow:auto}
textarea{width:100%;min-height:340px;resize:vertical;background:transparent;color:var(--ink);border:0;outline:0;
  font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.bar button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;
  padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.bar button[aria-pressed="true"]{border-color:var(--acc);color:var(--acc)}
#out{font-size:16px;line-height:1.8}
#out.chat{font-size:14px;line-height:1.6}
#out h1,#out h2,#out h3,#out h4,#out h5,#out h6{margin:1.1em 0 .5em;line-height:1.3}
#out h1{font-size:2.5em}#out h2{font-size:2em}#out h3{font-size:1.5em}
#out.chat h1{font-size:1.375em}#out.chat h2{font-size:1.25em}#out.chat h3{font-size:1.125em}
#out p{margin:.6em 0}
#out code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:.875em;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#out pre{background:var(--code);padding:12px;border-radius:8px;overflow:auto}
#out pre code{background:none;padding:0;font-size:.85em}
#out blockquote{margin:.8em 0;padding:.2em 0 .2em 14px;border-left:4px solid var(--line);color:var(--mut)}
#out table{border-collapse:collapse;margin:.8em 0;width:100%}
#out th,#out td{border:1px solid var(--line);padding:6px 9px;text-align:left}
#out th{background:var(--code)}
#out img{max-width:100%}
#out hr{border:0;border-top:1px solid var(--line);margin:1.4em 0}
.md-alert{border-left:4px solid var(--acc);background:var(--code);padding:10px 12px;border-radius:8px;margin:.8em 0}
.md-alert p{margin:.2em 0}
.state{font-size:12px;color:var(--mut);margin-left:auto;align-self:center}
</style></head><body>
<header>
  <button class="theme-btn" id="theme" title="Switch theme" aria-label="Switch theme">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>
  </button>
  <h1>markdown-kit</h1>
  <p class="mut">Markdown to HTML with a streaming reveal. Type on the left; press <strong>stream it</strong>
  to watch a reply arrive a character at a time without a broken parse flashing on every chunk.</p>
</header>

<main>
  <div class="bar">
    <button id="stream">stream it</button>
    <button data-variant="doc" aria-pressed="true">document</button>
    <button data-variant="chat" aria-pressed="false">chat</button>
    <span class="state" id="state"></span>
  </div>
  <div class="split">
    <div class="pane"><textarea id="src" spellcheck="false"></textarea></div>
    <div class="pane"><div id="out"></div></div>
  </div>
</main>

<footer class="mut" style="font-size:13px">
  <p>PolyForm Noncommercial 1.0.0. (c) 2026 Dr Sohil Momin. Streaming model from lobe-mygo pkg/markdown (MIT).</p>
</footer>

<script src="../markdown-kit.js"></script>
<script>
var Md = window.Md;
var out = document.getElementById("out");
var src = document.getElementById("src");
var state = document.getElementById("state");

var SAMPLE = [
  "# A reply that arrives in pieces",
  "",
  "A language model does not send a document. It sends chunks, and half of them end",
  "in the middle of a **code fence** or a *word*.",
  "",
  "> [!NOTE]",
  "> The tail that could still change is shown as text, never as a half parse.",
  "",
  "## What it handles",
  "",
  "- headings, paragraphs, hard breaks",
  "- **bold**, *italic*, ~~strike~~, `code`",
  "- [links](https://example.com) and images",
  "- lists, including nested ones",
  "",
  "1. ordered lists",
  "2. with a start number",
  "",
  "- [x] task lists",
  "- [ ] checked and unchecked",
  "",
  "| token | value |",
  "|:---|---:|",
  "| BgContainer | #ffffff |",
  "| BorderRadius | 8px |",
  "",
  "```js",
  "var Md = require(\"./markdown-kit.js\");",
  "Md.render(\"**hi**\");",
  "```",
  "",
  "---",
  "",
  "That is the whole kit."
].join("\n");

src.value = SAMPLE;
out.innerHTML = Md.render(SAMPLE);
state.textContent = "rendered, " + Md.blocks(SAMPLE).length + " blocks";

function render() {
  out.innerHTML = Md.render(src.value);
  state.textContent = Md.blocks(src.value).length + " blocks";
}
src.addEventListener("input", render);

/* ---------- streaming demo ---------- */
var timer = null;
document.getElementById("stream").addEventListener("click", function () {
  if (timer) { clearInterval(timer); timer = null; }
  var text = src.value, i = 0, s = Md.stream();
  out.innerHTML = "";
  timer = setInterval(function () {
    var step = 2 + Math.floor(Math.random() * 6);
    i = Math.min(text.length, i + step);
    var r = s.push(text.slice(i - step, i));
    out.innerHTML = r.html;
    state.textContent = r.complete ? "complete" : i + " / " + text.length + " chars, tail held back";
    if (i >= text.length) {
      clearInterval(timer); timer = null;
      var fin = s.done();
      out.innerHTML = fin.html;
      state.textContent = "complete, " + Md.blocks(text).length + " blocks";
    }
  }, 28);
});

/* ---------- variant ---------- */
document.querySelectorAll("[data-variant]").forEach(function (b) {
  b.addEventListener("click", function () {
    document.querySelectorAll("[data-variant]").forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
    b.setAttribute("aria-pressed", "true");
    out.className = b.dataset.variant === "chat" ? "chat" : "";
  });
});

/* ---------- theme ---------- */
(function () {
  var key = "markdown-kit-theme";
  function apply(t) { document.documentElement.setAttribute("data-theme", t); }
  var saved = null; try { saved = localStorage.getItem(key); } catch (e) {}
  var system = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  apply(saved || system);
  document.getElementById("theme").addEventListener("click", function () {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    apply(next); try { localStorage.setItem(key, next); } catch (e) {}
  });
})();
</script>
</body></html>
